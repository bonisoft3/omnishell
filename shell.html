<!doctype html>
<html lang="{language}" dir="{direction}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="{description}">
<!-- This one document answers at every route, so the URL it arrives under is
     not where it lives: without a base, ./boot.js is /boot.js at /games and
     nothing on the page runs at all. Links are composed absolute and are
     unaffected. -->
<base href="/shell/">
<title>Loading…</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./shell.css">
<link rel="stylesheet" href="./design.css">
{modulepreload}
<script type="speculationrules">
{
  "prefetch": [
    {
      "source": "document",
      "where": {
        "and": [
          { "href_matches": "/*" },
          { "not": { "href_matches": "/auth/*" } },
          { "not": { "href_matches": "/crud/*" } },
          { "not": { "href_matches": "/electric/*" } },
          { "not": { "href_matches": "/srv/*" } },
          { "not": { "href_matches": "/shell/*" } }
        ]
      },
      "eagerness": "moderate"
    }
  ]
}
</script>
</head>
<body>
<main id="app"></main>
<script type="module" src="./boot.js"></script>
</body>
</html>
