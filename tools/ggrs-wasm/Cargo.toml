[package]
name = "ggrs-wasm"
version = "0.1.0"
edition = "2021"
publish = false

# Not a member of the repository's workspace.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
ggrs = { version = "=0.13.0", features = ["wasm-bindgen"] }
bincode = "=1.3.3"
wasm-bindgen = "=0.2.129"
js-sys = "=0.3.106"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
