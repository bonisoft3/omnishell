# Publish this component: its CUE module to the Central Registry, its runtime
# tree as an image on Docker Hub (bonitao/omnishell) that an installed app's
# images copy from, and its tree as release assets a `mise install github:`
# reaches it by.
#
# GitHub reads workflows only from a repository's root .github/, so this file
# is inert in the monorepo and active only in the mirror, where copybara moves
# the component directory to the root (copy.bara.sky) and stages .mirror/cue.mod
# there as cue.mod. The module the publish reads is that staged one.
#
# The trigger is a plain `v*` tag, which the monorepo's own cd.yml creates here
# after locating the mirror commit by its GitOrigin-RevId trailer. Tagging the
# monorepo is what releases this module; nothing publishes from a branch.
#
# Prerequisite, configured once per module and not by this file: a trust entry
# on cue.dev binding this workflow to publish under the module path that
# cue.mod/module.cue declares. Without it the OIDC login below is refused. And
# a DOCKERHUB_TOKEN secret for bonitao, as mecha's and bayt's mirrors have.

name: cd

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  # The runtime image (.bayt/Dockerfile.runtime-image, from bayt.cue's
  # runtime-image target), pushed with the version on a tag. Its pin line is
  # what pronto's terminals/omnishell.cue `published` takes. FROM scratch with
  # COPYs only, so both platforms build without emulation.
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # mirror.gcr.io: dodge Docker Hub's anonymous pull cap on buildkit pulls.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
          # Mirrored too: the runner's daemon pulls this before buildkitd exists,
          # so the registry mirror cannot cover it.
          driver-opts: image=mirror.gcr.io/moby/buildkit:v0.30.0@sha256:0168606be2315b7c807a03b3d8aa79beefdb31c98740cebdffdfeebf31190c9f

      - name: Login to Docker Hub
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          username: bonitao
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: bonitao/omnishell
          tags: |
            type=semver,pattern={{version}}

      # As mecha's images: no provenance, SBOM or labels, and clamped
      # timestamps, so build metadata never moves the digest a pin names.
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        env:
          SOURCE_DATE_EPOCH: "0"
        with:
          context: .
          file: .bayt/Dockerfile.runtime-image
          target: runtime-image
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          provenance: false
          sbom: false
          outputs: ${{ startsWith(github.ref, 'refs/tags/') && 'type=registry,rewrite-timestamp=true' || 'type=cacheonly' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=runtime-image
          cache-to: type=gha,mode=max,scope=runtime-image

      - name: Pin
        if: startsWith(github.ref, 'refs/tags/')
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "runtime: \"bonitao/omnishell:${VERSION}@${DIGEST}\"" >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pinned to the version the module declares in language.version, so the
      # tool that validates on publish is the tool the module is written for.
      - name: Set up CUE
        uses: cue-lang/setup-cue@v1.0.1
        with:
          version: 'v0.16.1'

      # OIDC login to registry.cue.works — no token, no secret. The identity is
      # this workflow, which is what the cue.dev trust entry names.
      - name: Authenticate to CUE Central Registry
        uses: cue-labs/registry-login-action@v1

      # --check reads without writing: cue.mod/module.cue states its deps, and
      # a stale version there fails here rather than publishing a module whose
      # dependencies name something the registry no longer serves. The write
      # form would dirty the tree the publish below requires clean.
      - name: Dependencies are tidy
        run: cue mod tidy --check

      # `source: kind: "git"` in module.cue makes publish reject an unclean
      # working tree, so nothing may write to the checkout before this runs —
      # which is why the staging below, whose dist/ and omnishell-stage/ are
      # untracked, comes after it.
      - name: Publish CUE module
        run: cue mod publish "${GITHUB_REF_NAME}"

      - name: Stage release content
        run: |
          mkdir -p dist
          # The terminal is pure source (cue + ts + js) — no compile step. Its
          # command line runs off this tree, and every checker reaches the
          # interpreter and the harness under test/, so the whole tree ships
          # minus what only a repository needs.
          mkdir omnishell-stage
          tar cf - --exclude=.git --exclude=.github --exclude=node_modules --exclude=dist --exclude=omnishell-stage . | tar xf - -C omnishell-stage
          # Ship per-platform-named tarballs (same content). Mise's `github:`
          # backend matches the consumer runner's platform against the asset
          # name; for a source-only tool we publish one universal payload under
          # every platform name.
          for triple in linux-x64 linux-arm64 linux-armv7 macos-x64 macos-arm64 windows-x64 windows-arm64; do
            tar czf "dist/omnishell-${triple}.tar.gz" -C omnishell-stage .
          done

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
