      type: string
    - name: state
      type: string
  param_peer:
    fields:
    - name: id
      type: string
    - name: slug
      type: string
    - name: season
      type: string
seed:
  game_card:
  - id: missing
    state: nowhere
  - id: g1
    state: 'off'
    slug: base-final
  game:
  - id: g1
    slug: final&2026
  campaign:
  - id: missing
    team_id: t1
    championship_id: gone
    state: nowhere
  - id: joined
    team_id: t2
    championship_id: c1
    state: 'off'
  team:
  - id: t1
    slug: decoy
  - id: t2
    slug: joined-team
  championship:
  - id: c1
    slug: joined-season
  flat:
  - id: f1
    state: 'off'
  param_game:
  - id: p1
    slug: selected
  param_card:
  - id: c1
    slug: selected
    season: '2026'
    state: 'off'
  param_peer:
  - id: r1
    slug: other
    season: '2027'
