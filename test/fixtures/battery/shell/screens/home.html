<!-- Where the fixture's modules are called from: six gestures bound to a
     region, and one chart leaf handed the literals its reference states. -->
<main data-live="note">
  <button data-on-click="sound">sound</button>
  <button data-on-input="mutating">mutating</button>
  <button data-on-change="shapeless">shapeless</button>
  <button data-on-keydown="spinning">spinning</button>
  <button data-on-submit="unshipped">unshipped</button>
  <button data-on-focusin="bounded">bounded</button>
  <div
    data-live="note"
    data-machine='{"field":"kind","initial":"note","states":{"note":{"on":{"click":{"target":"link","assign":{"code":{"type":"params-read","params":{"col":"code"}}}}}},"link":{}}}'
  >
  </div>
</main>
