      <!-- The hand on the table. A list of one (current=eq.yes) rather than a

<script>
/* The dealer (ir.html #dealer, decision-02) — the app's one module.
   It owns the deck, the manilha rule, the house's play and the vaza
   arithmetic; it owns no writes: every consequence it decides is submitted
   through the forms above, and every value it reads about the match comes
   from the bindings the store already rendered. Cards in flight live here
   and nowhere else, which is why they are not rows. */
(() => {
  const screen = document.currentScript.closest('[data-screen="arena"]');
  if (!screen || screen._dealer) return;
  screen._dealer = true;

  const $ = (sel) => screen.querySelector(sel);
  const LADDER = { paulista: [1, 3, 6, 9, 12], mineiro: [2, 4, 8, 10, 12] };
  const RUNG_WORD = {
    paulista: { 3: "Truco!", 6: "Seis!", 9: "Nove!", 12: "Doze!" },
    mineiro: { 4: "Truco!", 8: "Seis!", 10: "Nove!", 12: "Doze!" },
  };
  const DEFAULT_VARIANT = "mineiro";
  // Eles at the close: `lost` is said to the winner, `won` as the winner.
  const CLOSING = {
    nezinho: { lost: "Tá com a mão boa, hein. Outra?", won: "Devagar se vai longe, menino." },
    cida: { lost: "Ai, meu bem. Hoje foi seu.", won: "Vem cá que a tia te ensina de novo." },
    tiao: { lost: "Eita! Levou, seu moço.", won: "Ó a viola! Doze pra nós." },
    ze: { lost: "Zé só balança a cabeça.", won: "Zé guarda as cartas sem dizer nada." },
  };
  const baseStake = (variant) => LADDER[variant][0];
  const OURS = { you: 1, parca: 1 };
  const THEM = ["eles1", "eles2"];
  const BEAT = 700;

  // Each variant has its own table talk. In Paulista a trick is a vaza and the
  // race to twelve is a partida; in Minas the trick is a rodada and the race to
  // twelve is a jogo. Both call the three-trick deal a mão. "Queda" is neither:
  // it is the tally above the jogo — two jogos won — and this app does not keep
  // one, so it does not use the word.
  const WORDS = {
    paulista: { trick: "vaza", match: "partida" },
    mineiro: { trick: "rodada", match: "jogo" },
  };
  const words = () => WORDS[st.variant] ?? WORDS.paulista;
  const cap = (w) => w.charAt(0).toUpperCase() + w.slice(1);

  const nextRung = (variant, stake) => {
    const l = LADDER[variant] ?? LADDER.paulista;
    const i = l.indexOf(Number(stake));
    return i >= 0 && i < l.length - 1 ? l[i + 1] : null;
  };

  /* --- the store, read off the bindings ---------------------------------- */

  // What the dealer keeps, which is only what it needs to open a sitting and
  // to draw one. Everything about a hand is on the rows.
  const st = (globalThis.__truco ??= {
    matchId: "", roundId: "", order: [], mao: "you",
    variant: DEFAULT_VARIANT, opponent: "nezinho", partner: "bigode",
    seats: "1v1", theme: "xadrez", hand: 1,
    stake: baseStake(DEFAULT_VARIANT), timers: [],
  });

  // The terminal replaces a screen without telling the code inside it, and a
  // pending timer outlives the DOM it was scheduled from. A write from a
  // detached screen reaches nothing — the form's listeners are gone — so the
  // engine would go on believing in a match the store never got. Every
  // deferred step checks that its screen is still the one on stage.
  const alive = () => screen.isConnected;

  const wait = (fn, ms) => {
    const t = setTimeout(() => {
      if (!alive()) { clearWaits(); return; }
      fn();
    }, ms);
    st.timers.push(t);
  };
  // The tell's latch is released with the waits. It is set before a tell and
  // dropped in the deferred callback that turns the tell into a call, so
  // cancelling the callbacks without dropping it here would strand it set and
  // silence every tell for the rest of the sitting.
  const clearWaits = () => { st.timers.forEach(clearTimeout); st.timers = []; st.told = false; };

  const seatsOf = (mode) => (mode === "2v2" ? ["you", "eles1", "parca", "eles2"] : ["you", "eles1"]);

  /* --- rendering --------------------------------------------------------- */

  const phase = (p) => { const el = $(".play"); if (el) el.dataset.phase = p; };

  // The angle a card lies at once it is down. Derived from the card itself, so
  // it is the same every time that card is played and never reshuffles under
  // the eye — cards thrown on a table do not land square, and they do not
  // straighten themselves afterwards either. It rides on the row, because a
  // template binds fields and cannot compute one.
  // Where the card was when you let go of it. The copy that appears on the mat
  // is a different element, so without this a play reads as a teleport: the
  // hand card disappears and a mat card blinks into existence somewhere else.
  let flightFrom = null;
  const still = () => matchMedia("(prefers-reduced-motion: reduce)").matches;

  // A card leaves the hand at the angle it was fanned to. Carrying that angle
  // into the flight is what makes it read as a card thrown onto the cloth
  // rather than a tile sliding across it.
  // The angle the card was fanned to, read off its place in the hand rather
  // than off the element: a card is hovered at the moment it is clicked, and
  // the hover flattens it, so the computed rotation is always zero by then.
  const tiltOf = (el) => {
    const sibs = [...(el.parentElement?.children ?? [])];
    const i = sibs.indexOf(el);
    if (sibs.length < 2) return 0;
    return i === 0 ? -5 : i === sibs.length - 1 ? 5 : 0;
  };

  const flyFrom = (el) => {
    flightFrom = still() ? null : Object.assign(el.getBoundingClientRect().toJSON(), { tilt: tiltOf(el) });
  };

  // The card announces its own arrival: the felt's rows land when the store
  // says so, not when the dealer draws, and the enter animation the card
  // already carries is the event that says it is there. Delegated to the
  // screen because the mat's nodes belong to the terminal.
  const wireFlight = () => {
    if (screen.dataset.flight) return;
    screen.dataset.flight = "1";
    screen.addEventListener("animationstart", (e) => {
      if (e.animationName !== "land" || still()) return;
      const el = e.target;
      const seat = el.closest(".played")?.dataset.seat ?? "";
      if (seat === "you") { if (flightFrom) takeFlight(el, flightFrom); return; }
      // From the back marked for exit, else the last one standing. The back
      // only turns edge-on (back-turn); the flight is the rest of the turn.
      const row = screen.querySelector(`.seat-row.house[data-seat="${seat}"]`);
      const back = row?.querySelector(".card-back[data-exit]") ?? row?.querySelector(".card-back:last-child");
      if (back) takeFlight(el, Object.assign(back.getBoundingClientRect().toJSON(), { tilt: 0, turn: true }));
    });
  };

  const takeFlight = (el, from) => {
    flightFrom = null;
    // A frame first: the first card of a rodada replaces the empty slot, so the
    // mat's geometry is still the old one at this point and the flight would
    // be measured to where the card is not.
    requestAnimationFrame(() => {
      const to = el.getBoundingClientRect();
      if (!to.width || !from.width) return;
      const dx = from.left - to.left;
      const dy = from.top - to.top;
      const scale = from.width / to.width;
      // Rotation composes with the lie the card will keep, so the flight is
      // stated relative to it: it starts at the angle the hand held it at,
      // turns past where it will settle, and comes back.
      const lie = parseFloat(el.closest(".played")?.style.getPropertyValue("--lie") ?? "0") || 0;
      const start = from.tilt - lie;
      const over = start >= 0 ? -6 : 6;
      const y0 = from.turn ? " rotateY(90deg)" : "";
      const y1 = from.turn ? " rotateY(30deg)" : "";
      el.animate(
        [
          { transform: `translate(${dx}px, ${dy}px) rotate(${start}deg) scale(${scale})${y0}`, offset: 0 },
          {
            transform: `translate(${dx * 0.42}px, ${dy * 0.42}px) rotate(${over}deg) scale(${(scale + 1) / 2})${y1}`,
            offset: 0.7,
          },
          { transform: "translate(0, 0) rotate(0deg) scale(1) rotateY(0deg)", offset: 1 },
        ],
        { duration: 460, easing: "cubic-bezier(.2,.86,.28,1)" },
      );
    });
  };

  // The hand belongs to the terminal now. What stays the dealer's is whether a
  // card may be played, and what happens when one is — both attached once, to
  // the region rather than to the cards, because the cards come and go.
  const wireTable = () => {
    if (screen.dataset.table) return;
    screen.dataset.table = "1";
    const again = () => render();
    // childList as well as attributes: an item's bindings are resolved before
    // the node is put in the tree, so a hand arriving for the first time is an
    // insertion and nothing else. Everything below writes only where it
    // differs, because this fires on what it writes.
    new MutationObserver(again).observe(screen, {
      subtree: true,
      childList: true,
      attributes: true,
      attributeFilter: [
        "data-v1", "data-v2", "data-v3", "data-result", "data-asked", "data-rung",
        "data-raised", "data-status", "data-hand", "data-stake",
      ],
    });
    // Watched where the cards are and nowhere wider: the ladder button carries
    // `disabled` too, and redrawing it is what this fires on — a screen-wide
    // watch on that attribute is a loop with a render in it.
    const mine = $("#seat-you");
    if (mine) new MutationObserver(again).observe(mine, { subtree: true, attributes: true, attributeFilter: ["disabled"] });
  };

  const wireHand = () => {
    const mine = $("#seat-you");
    if (!mine || mine.dataset.wired) return;
    mine.dataset.wired = "1";
    // Where the card was when you let go of it. The play itself is the
    // table's — this only remembers where the flight starts from.
    mine.addEventListener("click", (e) => {
      const el = e.target.closest(".card");
      if (el !== null && !el.disabled) flyFrom(el);
    });
  };

  // Continuity for what lies on the felt. The terminal keeps a row's node
  // across redraws, but a redraw moves it in one frame: a trick closing, the
  // next one opening, a hand re-centring as a card leaves. Every card's laid
  // box is remembered after each redraw, and one that moved is carried from
  // where the eye last had it to where it lies now.
  //
  // Two passes, because a measurement is a layout and a carry is a transform:
  // first every box is read with the running carries on it (where the eye has
  // it), the carries are cancelled, and it is read again (where it lies); only
  // then are the new carries started, so no box is read through another's.
  // Additive: a played card keeps the lie its own transform gives it.
  const CARRY = { id: "carry", duration: 420, easing: "cubic-bezier(.2,.86,.28,1)", composite: "add" };
  const boxes = new Map();
  // Once per task, however many redraws a wake brings: every read below is a
  // layout, and a batch of them between a mutation and its paint is the jank
  // this exists to remove. A microtask, not a frame: the terminal redraws
  // inside a frame, and a frame requested there paints once without carries.
  let carrying = false;
  const carrySoon = () => {
    if (carrying) return;
    carrying = true;
    queueMicrotask(() => { carrying = false; if (alive()) carryAll(); });
  };
  const carryAll = () => {
    if (still()) { boxes.clear(); return; }
    const seen = new Set();
    const moves = [];
    const rectOf = (el) => el.getBoundingClientRect();
    const boxOf = (r, ow) => ({ x: r.left, y: r.top, w: r.width, h: r.height, ow });
    // Where the eye has it, then where it lies, in one frame of reference.
    const read = (el, frame = (r) => r) => {
      const seenAt = frame(rectOf(el));
      for (const a of el.getAnimations()) if (a.id === "carry") a.cancel();
      const lies = frame(rectOf(el));
      return { seenAt, lies };
    };
    // A box that changed size by scale is carried about its centre; one that
    // changed by layout, a trick taking a second card, keeps its left edge.
    const plan = (key, el, seenAt, lies) => {
      seen.add(key);
      const was = boxes.get(key);
      boxes.set(key, lies);
      if (!was || el.hasAttribute("data-enter") || el.hasAttribute("data-exit")) return;
      // The layout's change, times whatever the cancelled carry still owed.
      const kl = lies.w > 0 && was.ow > 0 && lies.ow > 0 ? (was.w / was.ow) / (lies.w / lies.ow) : 1;
      const k = kl * (lies.w > 0 ? seenAt.w / lies.w : 1);
      const scaled = Math.abs(k - 1) >= 0.01;
      const cx = (b) => b.x + b.w / 2, cy = (b) => b.y + b.h / 2;
      const dx = scaled ? cx(was) - cx(lies) + cx(seenAt) - cx(lies) : was.x - lies.x + seenAt.x - lies.x;
      const dy = scaled ? cy(was) - cy(lies) + cy(seenAt) - cy(lies) : was.y - lies.y + seenAt.y - lies.y;
      if (Math.abs(dx) < 0.5 && Math.abs(dy) < 0.5 && !scaled) return;
      moves.push([el, `translate(${dx}px, ${dy}px) scale(${scaled ? k : 1})`]);
    };
    const roundId = attrOf("data-round-id");
    for (const el of screen.querySelectorAll(".matcards .trick")) {
      const { seenAt, lies } = read(el, (r) => boxOf(r, el.offsetWidth || r.width));
      if (lies.w === 0) continue;
      plan(`trick/${roundId}/${el.dataset.t}`, el, seenAt, lies);
      // A card's place inside its trick, in the trick's own units.
      const k = lies.w / lies.ow;
      const local = (r) => ({ x: (r.left - lies.x) / k, y: (r.top - lies.y) / k, w: r.width / k, h: r.height / k, ow: 0 });
      for (const card of el.querySelectorAll(".played")) {
        const c = read(card, (r) => local(r));
        plan(card.dataset.id, card, c.seenAt, c.lies);
      }
    }
    for (const el of screen.querySelectorAll(".seat-row.mine .card")) {
      const { seenAt, lies } = read(el, (r) => boxOf(r, el.offsetWidth));
      plan(el.dataset.row, el, seenAt, lies);
    }
    for (const el of screen.querySelectorAll(".seat-row.house .card-back")) {
      const { seenAt, lies } = read(el, (r) => boxOf(r, el.offsetWidth));
      plan(el.dataset.id, el, seenAt, lies);
    }
    for (const key of boxes.keys()) if (!seen.has(key)) boxes.delete(key);
    for (const [el, from] of moves) el.animate([{ transform: from }, { transform: "none" }], CARRY);
  };

  // The chrome the table does not draw for itself, redrawn from the rows it
  // does. Nothing here decides anything: every value below is already stated
  // on the match or on the hand.
  // Written only where it differs, every time: this runs from an observer
  // watching the tree it draws into, so a redraw that rewrites what is already
  // there is a redraw that calls itself.
  const setText = (el, text) => { if (el !== null && el.textContent !== text) el.textContent = text; };

  // One node per letter so each lands on its own beat. Restarted the way the
  // talk strip is.
  const shout = (word, side, kind = "call") => {
    const el = $(".shout");
    if (!el || word === "") return;
    el.replaceChildren(...[...word].map((ch, i) => {
      const l = document.createElement("i");
      l.textContent = ch === " " ? "\u00a0" : ch;
      l.style.setProperty("--i", i);
      return l;
    }));
    el.dataset.from = side;
    el.dataset.kind = kind;
    el.dataset.state = "live";
    el.dataset.t = el.dataset.t === "1" ? "2" : "1";
    const bulb = $(".bulb");
    if (bulb) bulb.dataset.t = bulb.dataset.t === "1" ? "2" : "1";
  };
  // Lowers the shout of one kind only: a run is said on the wake its row
  // lands, and the call it answers is cleared on the next.
  const hush = (kind) => {
    const el = $(".shout");
    if (el && el.dataset.state === "live" && el.dataset.kind === kind) el.dataset.state = "gone";
  };

  const render = () => {
    const box = $(".matchbox");
    if (!box) return;
    const rung = Number(attrOf("data-rung"));
    const asked = attrOf("data-asked");
    const yours = screen.querySelector(".seat-row.mine .card:not([disabled])") !== null;
    const ours = attrOf("data-raised") === "us";

    const truco = $("#btn-truco");
    if (truco) {
      // Written only where it differs. Everything below is watched by the
      // observer that called this, and a redraw that writes what is already
      // there is a redraw that calls itself.
      const off = ours || rung === 0 || asked !== "" || !yours;
      if (truco.disabled !== off) truco.disabled = off;
      setText(truco, ours
        ? "SUBIR É COM ELES"
        : rung === 0 ? "NO MÁXIMO"
        : !yours ? "NA VEZ DELES"
        : (RUNG_WORD[st.variant] ?? {})[rung] ? RUNG_WORD[st.variant][rung].toUpperCase() : "TRUCO!");
      truco.title = ours
        ? "Quem pediu não aumenta: a vez de subir é deles."
        : !yours ? "Só pede quem está na vez de jogar."
        : "Aumentar a aposta desta mão";
    }

    // While a call stands the round's stake is what the hand is still worth
    // and its rung is what was asked for (table.js keeps both).
    const stood = Number(attrOf("data-stake"));
    const climb = nextRung(st.variant, rung);
    const wordOf = (r) => ((RUNG_WORD[st.variant] ?? {})[r] ?? "").toUpperCase();
    setText($("#btn-accept small"), `vale ${rung}`);
    const raise = $("#btn-raise");
    if (raise) {
      const maxed = climb === null;
      if (raise.disabled !== maxed) raise.disabled = maxed;
      setText($("#btn-raise b"), maxed ? "NO MÁXIMO" : wordOf(climb));
      setText($("#btn-raise small"), maxed ? "doze é o teto" : `sobe pra ${climb}`);
    }
    setText($("#btn-run small"), `eles levam ${stood}`);

    // Read off the row rather than off the click, so the house's call shouts
    // the same way yours does. The first reading after a load is not a
    // landing: a page opened mid-call has nothing to throw.
    if (st.asked === undefined) st.asked = asked;
    if (asked !== st.asked) {
      if (asked !== "") shout(wordOf(rung), sideOf(asked));
      else hush("call");
      st.asked = asked;
    }

    // A tell is the one line the fold ends with an ellipsis (table.js CAST);
    // the seats wear it while it stands, and each persona has a gesture.
    const seats = $(".seats");
    if (seats) {
      const telling = attrOf("data-said").endsWith("…") ? box.dataset.opponent : "";
      if ((seats.dataset.tell ?? "") !== telling) {
        if (telling === "") delete seats.dataset.tell;
        else seats.dataset.tell = telling;
      }
    }

    // Who ran is on the log; the round only says that nobody is asking.
    const ranRow = screen.querySelector('.log li[data-kind="run"]');
    const ran = ranRow === null ? "" : sideOf(ranRow.dataset.seat);
    if (st.ran === undefined) st.ran = ran;
    if (ran !== st.ran) {
      if (ran !== "") shout("CORRI", ran, "run");
      st.ran = ran;
    }

    // The first reading after a load is the score as found, not a score moved.
    const us = Number(box.dataset.us), them = Number(box.dataset.them);
    if (st.us === undefined) { st.us = us; st.them = them; }
    if (us > st.us) carry("us", st.us, us);
    if (them > st.them) carry("them", st.them, them);
    st.us = us; st.them = them;

    const closed = box.dataset.status === "over";
    if (st.closed === undefined) st.closed = closed;
    if (closed !== st.closed) {
      if (closed) shout(box.dataset.winner === "us" ? "É NOSSA!" : "LEVAMOS!", box.dataset.winner === "us" ? "us" : "them", "close");
      else hush("close");
      st.closed = closed;
    }

    // The phase the board wears. It is a reading of the hand, not a state the
    // dealer keeps: over, decided, asked of you, yours to play, or theirs.
    // A line that replaces another has to land, and a CSS animation only
    // restarts when its name changes — so the strip alternates between two
    // that are the same.
    const talk = $(".talk");
    if (talk !== null && talk.textContent !== attrOf("data-said")) {
      talk.textContent = attrOf("data-said");
      talk.dataset.t = talk.dataset.t === "1" ? "2" : "1";
    }

    const play = $(".play");
    if (play) {
      if ((play.dataset.ran ?? "") !== ran) {
        if (ran === "") delete play.dataset.ran;
        else play.dataset.ran = ran;
      }
      play.dataset.phase = box.dataset.status === "over"
        ? "over"
        : hand() === null ? "idle"
        : attrOf("data-result") !== "" ? "resolved"
        : sideOf(asked) === "them" && asked !== "" ? "raised"
        : yours ? "your-turn" : "waiting";
    }

    const over = $("#over-line");
    if (over && box.dataset.status === "over") {
      setText(over, box.dataset.winner === "us" ? "Partida sua!" : `${$(".eles-name")?.textContent ?? "Eles"} levou.`);
      const closing = CLOSING[box.dataset.opponent] ?? CLOSING.nezinho;
      setText($("#over-say"), box.dataset.winner === "us" ? closing.lost : closing.won);
    }

    carrySoon();
  };

  // Tentos in flight, from the middle of the felt to the side that scored.
  // The rack's markers are bound to the score and show at once; the ones the
  // score just added are held back until the flight lands on them.
  const carry = (side, had, has) => {
    const play = $(".play");
    const rack = $(`.score.${side} .tentos`);
    if (!play || !rack) return;
    const from = play.getBoundingClientRect();
    const to = rack.getBoundingClientRect();
    const x0 = from.left + from.width / 2, y0 = from.top + from.height * 0.4;
    const x1 = to.left + to.width / 2, y1 = to.top + to.height / 2;
    const landing = [...rack.children].slice(had, has);
    landing.forEach((m) => { m.dataset.landing = "1"; });
    for (let i = 0; i < Math.min(has - had, 12); i++) {
      const bean = document.createElement("i");
      bean.className = "tento fly";
      bean.style.setProperty("--x0", `${x0 - from.left}px`);
      bean.style.setProperty("--y0", `${y0 - from.top}px`);
      bean.style.setProperty("--dx", `${x1 - x0 + (i % 3 - 1) * 6}px`);
      bean.style.setProperty("--dy", `${y1 - y0 + Math.floor(i / 3) * 4}px`);
      bean.style.setProperty("--i", i);
      bean.addEventListener("animationend", () => { bean.remove(); landing.forEach((m) => delete m.dataset.landing); }, { once: true });
      play.append(bean);
    }
  };

  // Whoever is on turn acts: you wait for a tap, the house answers on a beat.
  const hand = () => screen.querySelector(".hand[data-round-id]");
  const attrOf = (name) => hand()?.getAttribute(name) ?? "";
  const sideOf = (seat) => (seat === "you" || seat === "parca" ? "us" : "them");

  /* --- controls ---------------------------------------------------------- */

  const bind = (sel, fn) => { const el = $(sel); if (el) el.addEventListener("click", fn); };

  // Only the two the dealer still owns. The bet's four buttons say what they
  // did straight to the table, which reads what follows off the log.
  // Nothing the dealer does: it says so to the table, which is what deals.

  // Which option is in force: aria-checked follows the value the row binds.
  // Openness, dismissal, Escape and focus return are the popover's own.
  for (const picker of screen.querySelectorAll(".picker")) {
    const sync = () => {
      const v = picker.dataset.value;
      for (const opt of picker.querySelectorAll("[data-opt]")) {
        opt.setAttribute("aria-checked", String(opt.dataset.opt === v));
      }
    };
    new MutationObserver(sync).observe(picker, { attributes: true, attributeFilter: ["data-value"] });
    sync();
  }

  /* --- posed frames ------------------------------------------------------ */

  // The storybook renders this screen once per storyboard state against a
  // read-only fixture store. The dealer must not play there — it poses, so
  // the frames review the same card markup the table draws.
  const posing = new URLSearchParams(location.search).has("storybook");

  const pose = () => {
    const state = screen.dataset.state ?? "populated";
    const base = state.replace(/-dark$/, "");
    st.variant = "mineiro";
    render();
    // The frame's phase is the storyboard's, not a reading of the fixtures:
    // these are the states the screen must be reviewable in, whether or not a
    // fixture can be arranged to produce one.
    const play = $(".play");
    if (play) {
      play.dataset.phase = {
        loading: "waiting", empty: "idle", populated: "your-turn", picking: "your-turn",
        raised: "raised", resolved: "resolved", "match-over": "over",
      }[base] ?? "your-turn";
    }
    const line = $("#over-line");
    if (line && base === "match-over") line.textContent = "Partida sua!";
    if (base === "picking") {
      screen.querySelector('[data-picker="theme"] ul')?.showPopover?.();
    }
  };

  if (posing) {
    new MutationObserver(pose).observe(screen, { attributes: true, attributeFilter: ["data-state"] });
    pose();
    return;
  }

  /* --- boot -------------------------------------------------------------- */

  // The board is exactly the viewport minus the terminal's chrome. The
  // stylesheet carries a fallback; this makes it exact, and re-measures when
  // the window changes shape.
  const fitChrome = () => {
    const nav = document.querySelector("body > nav");
    screen.style.setProperty("--chrome", `${nav ? nav.getBoundingClientRect().height : 0}px`);
  };
  fitChrome();
  addEventListener("resize", fitChrome);
  wireHand();
  wireTable();
  wireFlight();

  // A returning screen (keep: 0, so this runs on every visit) finds the
  // engine state where it left it; a first visit finds an empty store and
  // deals into it.
  // What the engine remembers and what the store holds can part ways — a
  // reload empties the store, and a write from a screen already replaced never
  // landed. The bound match id is the store's own answer, so the dealer asks
  // it before trusting its memory.
  // A bound attribute still holds its "{field}" template until the region
  // first renders, so every read off the DOM is filtered through this: an
  // unresolved placeholder is not a value, it is the absence of one.
  const bound = (v, fallback) => (!v || v.includes("{") ? fallback : v);

  const boundMatch = () => {
    const raw = $(".matchbox")?.dataset.matchId;
    return raw === undefined || raw === "" || raw.includes("{") ? null : raw;
  };

  // Take up the match already on the table rather than starting another. The
  // match outlives the tab and the dealer does not, so a reload arrives with a
  // sitting in progress and no memory of it — and minting a second one leaves
  // two matches `playing`, which the arena reads as a singleton: it binds one
  // of them and the dealer writes to the other. The theme picker stops working
  // and nothing says why.
  const adopt = () => {
    const box = $(".matchbox");
    const id = boundMatch();
    if (id === null) return false;
    st.matchId = id;
    st.variant = bound(box.dataset.variant, DEFAULT_VARIANT);
    st.seats = bound(box.dataset.seats, "1v1");
    st.theme = bound(box.dataset.theme, "xadrez");
    st.order = seatsOf(st.seats);
    st.hand = Number(bound(box.dataset.hand, "1"));
    st.stake = Number(bound(box.dataset.stake, String(baseStake(st.variant))));
    st.roundId = attrOf("data-round-id");
    // The mão follows the hand's number, so a sitting picked up mid-way deals
    // the next one to the seat whose turn it is rather than starting the
    // rotation again.
    st.mao = bound(attrOf("data-leader"), st.order[(st.hand - 1) % st.order.length]);
    return true;
  };

  const reconcile = () => {
    const held = boundMatch();
    if (held === null) return false;
    if (st.matchId && held !== st.matchId) {
      st.matchId = "";
      st.roundId = "";
      st.order = [];
    }
    return true;
  };

  const boot = () => {
    const box = $(".matchbox");
    if (!st.matchId && !adopt()) { phase("idle"); return; }
    // A hand still in play, or a match already decided: the table is what it
    // is and the chrome only has to catch up with it.
    // Whether a hand is in play is a fact about the rows, not about what the
    // dealer happens to remember: it may have joined this sitting a moment ago.
    const mine = screen.querySelectorAll("#seat-you .card").length;
    if (box?.dataset.status === "over" || (mine > 0 && attrOf("data-result") === "")) {
      render();
      return;
    }
    // The last hand finished while the reader was elsewhere. Nothing to do:
    // the table deals the next one itself, off the same rows this reads.
    render();
  };

  // The region binds a frame or two after the screen mounts; the dealer waits
  // for the store's answer rather than acting on a placeholder.
  let tries = 0;
  const settle = () => {
    if (!alive()) return;
    if (reconcile() || tries++ > 20) { boot(); return; }
    setTimeout(settle, 50);
  };
  settle();
})();
</script>
