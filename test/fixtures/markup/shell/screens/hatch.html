<!-- Three mounts against one unit's ports: a unit nobody declared, a mount in
     a region whose row the unit does not read, and a mount handling an event
     the unit does not raise — and, of its memo, binding one key field of two
     in a region that does not read the memo's table. The unit's second raise,
     verdict, is handled by no mount on any screen, which is shell.yaml's own
     finding. -->
<section data-live="note" data-filter="id=eq.the" data-empty="none">
  <div data-hatch="ghost" data-on-answer="spun" data-prop-title="{title}"></div>
  <div data-hatch="oracle" data-on-answer="spun" data-on-echo="spun" data-prop-title="{title}"></div>
</section>
