# A fixture app for check-markup. Not emitted by pronto — hand-written, and
# check-markup's self-test is its only reader, which is why the screens that
# break a rule live here beside the one that breaks none rather than in an app.
#
# `schema:` and `routes:` are declared, which is what the check reads; the
# screens come from route files and the shipped modules from shell/handlers/.
# `routes:` carries the two shapes the link rule distinguishes — a pattern with
# no hole, and one with a `:param` a link has to fill.
#
# `note` is the browser tier every rule about writes and carets needs, `post`
# the server tier they refuse, and `detail` the second table a nested region
# binds. Each of the two carries a money column, so the format rule has both a
# declaration to resolve and a table to resolve it on. The partial unique on
# `note` is declared with a predicate this grammar cannot read: it witnesses
# nothing, and saying so is the schema's own finding. `units:` carries one
# unit whose ports the hatch screen's mounts disagree with on every count,
# and one raise no mount handles.
schema:
  note:
    durability: tab
    fields:
      - {name: id, type: text, pk: true}
      - {name: kind, type: text, enum: [note, link]}
      - {name: title, type: text}
      - {name: state, type: text}
      - {name: mark, type: text}
      - {name: step, type: int}
      - {name: amount, type: int, money: {currency: BRL, minorUnits: 0}}
    uniques:
      - {name: one-pinned, cols: [title], where: "title=fts.rain"}
  detail:
    durability: tab
    fields:
      - {name: id, type: text, pk: true}
      - {name: body, type: text}
      - {name: cents, type: int, money: {currency: USD, minorUnits: 2}}
  post:
    durability: live
    fields:
      - {name: id, type: text, pk: true}
      - {name: cursor, type: text}
routes:
  - {path: /, screen: sound, files: {html: shell/screens/sound.html}}
  - {path: /note/:id, screen: detail, files: {html: shell/screens/sound.html}}
  - {path: /arity, screen: arity, files: {html: shell/screens/arity.html}}
  - {path: /columns, screen: columns, files: {html: shell/screens/columns.html}}
  - {path: /control, screen: control, files: {html: shell/screens/control.html}}
  - {path: /format, screen: format, files: {html: shell/screens/format.html}}
  - {path: /hatch, screen: hatch, files: {html: shell/screens/hatch.html}}
  - {path: /kinds, screen: kinds, files: {html: shell/screens/kinds.html}}
  - {path: /link, screen: link, files: {html: shell/screens/link.html}}
  - {path: /machine, screen: machine, files: {html: shell/screens/machine.html}}
  - {path: /nested, screen: nested, files: {html: shell/screens/nested.html}}
  - {path: /parallel, screen: parallel, files: {html: shell/screens/parallel.html}}
  - {path: /refuses, screen: refuses, files: {html: shell/screens/refuses.html}}
  - {path: /slot, screen: slot, files: {html: shell/screens/slot.html}}
  - {path: /unknown, screen: unknown, files: {html: shell/screens/unknown.html}}
  - {path: /writes, screen: writes, files: {html: shell/screens/writes.html}}
units:
  oracle:
    isolation: agent
    ports: {reads: [detail], raises: {answer: {}, verdict: {}}}
    memo: {table: detail, key: [title, body], columns: [title, body]}
    src: shell/units/oracle.js
